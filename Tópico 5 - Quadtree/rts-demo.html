<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadtree RTS Demo — Simulação de Combate 2D</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --panel-bg: rgba(13, 17, 25, 0.86);
      --panel-border: rgba(255, 255, 255, 0.14);
      --control-bg: rgba(255, 255, 255, 0.08);
      --control-hover: rgba(255, 255, 255, 0.15);
      --control-border: rgba(255, 255, 255, 0.18);
      --text: #f3f4f6;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --red: #fb7185;
      --green: #4ade80;
      --warn: #fbbf24;
      --radius: 10px;
      --radius-sm: 6px;
      --scrollbar-thumb: rgba(148, 163, 184, 0.28);
      --scrollbar-hover: rgba(148, 163, 184, 0.52);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas#arena {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* HUD flutuante minimalista */
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 20;
      width: 296px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
      scrollbar-gutter: stable;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.52);
      font-size: 13px;
    }

    #hud::-webkit-scrollbar { width: 6px; }
    #hud::-webkit-scrollbar-track { background: transparent; margin: 6px 0; }
    #hud::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 999px; }
    #hud::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    #hud.collapsed {
      width: auto;
      padding: 8px 10px;
    }

    #hud.collapsed #hudBody {
      display: none;
    }

    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .hud-nav {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .chip-link {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      min-height: 26px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 600;
    }

    .chip-link:hover {
      background: rgba(56, 189, 248, 0.24);
    }

    #hudBody {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    button {
      appearance: none;
      background: var(--control-bg);
      color: var(--text);
      border: 1px solid var(--control-border);
      border-radius: var(--radius-sm);
      font: inherit;
      font-weight: 600;
      padding: 7px 10px;
      min-height: 34px;
      cursor: pointer;
      text-align: left;
      transition: background-color 130ms ease, border-color 130ms ease;
    }

    button:hover {
      background: var(--control-hover);
      border-color: rgba(255, 255, 255, 0.32);
    }

    button#toggleHudBtn {
      width: 28px;
      min-width: 28px;
      min-height: 26px;
      padding: 0;
      text-align: center;
      line-height: 1;
    }

    .btn-on {
      border-color: rgba(74, 222, 128, 0.5);
      background: rgba(74, 222, 128, 0.14);
      color: #bbf7d0;
    }

    .btn-off {
      border-color: rgba(251, 113, 133, 0.5);
      background: rgba(251, 113, 133, 0.14);
      color: #fecdd3;
    }

    .btn-wave {
      border-color: rgba(251, 113, 133, 0.42);
      background: rgba(251, 113, 133, 0.12);
      color: #fecdd3;
    }

    .btn-wave:hover {
      background: rgba(251, 113, 133, 0.22);
      border-color: rgba(251, 113, 133, 0.65);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .row-2 button {
      text-align: center;
      font-size: 12px;
      padding: 6px 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--muted);
    }

    .field-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 500;
    }

    .field-top strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      cursor: pointer;
      user-select: none;
    }

    .check-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    #metrics {
      margin: 0;
      padding: 9px 10px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      white-space: pre-wrap;
    }

    .controls-hint {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 7px;
    }

    .controls-hint strong {
      color: var(--text);
    }

    #hud :focus-visible {
      outline: 2px solid #7dd3fc;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <canvas id="arena" aria-label="Arena de combate 2D RTS com Quadtree"></canvas>

  <aside id="hud" role="region" aria-label="Controles e benchmark RTS">
    <div class="hud-header">
      <span class="hud-title">Quadtree RTS</span>
      <div class="hud-nav">
        <a class="chip-link" href="index.html" title="Simulador de colisões">Simulador</a>
        <a class="chip-link" href="bench/benchmark.html" title="Benchmarks">Bench</a>
        <button id="toggleHudBtn" type="button" aria-expanded="true" aria-controls="hudBody" title="Minimizar ou expandir painel (tecla H)">−</button>
      </div>
    </div>

    <div id="hudBody">
      <button id="quadtreeToggle" class="btn-on" type="button">Quadtree: ON (Espacial)</button>

      <label class="check-row" for="gridToggle">
        <input id="gridToggle" type="checkbox" checked>
        <span>Mostrar grade da Quadtree</span>
      </label>

      <label class="check-row" for="rangesToggle">
        <input id="rangesToggle" type="checkbox" checked>
        <span>Mostrar alcance das torres</span>
      </label>

      <label class="check-row" for="autoWaveToggle">
        <input id="autoWaveToggle" type="checkbox">
        <span>Ondas automáticas (10 s)</span>
      </label>

      <label class="field" for="capacitySlider">
        <span class="field-top">
          <span>Capacidade por nó</span>
          <strong id="capacityVal">4</strong>
        </span>
        <input id="capacitySlider" type="range" min="1" max="16" value="4">
      </label>

      <button id="spawnModeBtn" type="button" title="Alterna spawn por clique ou use teclas B/R no cursor">Spawn no clique: OFF</button>

      <div class="row-2">
        <button id="spawnBlueBtn" type="button" title="Atalho: tecla B no cursor">+50 Azul (B)</button>
        <button id="spawnRedBtn" type="button" title="Atalho: tecla R no cursor">+50 Vermelho (R)</button>
      </div>

      <button id="waveBtn" class="btn-wave" type="button" title="Atalho: tecla W">Enviar Onda Inimiga (+40) [W]</button>

      <button id="resetBtn" type="button">Resetar Batalha (3 Torres + 300)</button>

      <pre id="metrics" aria-label="Métricas em tempo real"></pre>

      <div class="controls-hint">
        <strong>Arrastar Esq.:</strong> Selecionar Azuis<br>
        <strong>Botão Dir.:</strong> Mover selecionadas<br>
        <strong>Teclas B / R:</strong> +50 unidades no cursor<br>
        <strong>Tecla W:</strong> Enviar onda inimiga (+40 Verm.)<br>
        <strong>Tecla H:</strong> Recolher/abrir HUD
      </div>
    </div>
  </aside>

  <script>
    // =========================================================================
    // 1. ESTRUTURA DE DADOS: BOUNDARY & QUADTREE
    // =========================================================================

    /**
     * Representa os limites retangulares (AABB) de um nó da Quadtree
     * ou de uma área de consulta (range query).
     */
    class Boundary {
      constructor(x, y, w, h) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
      }

      // Verifica se uma entidade (ponto x, y) pertence a este retângulo.
      // Bordas esquerda/superior inclusivas; direita/inferior exclusivas.
      contains(entity) {
        return (
          entity.x >= this.x &&
          entity.x < this.x + this.w &&
          entity.y >= this.y &&
          entity.y < this.y + this.h
        );
      }

      // Verifica interseção AABB entre este nó e a área de busca `range`.
      intersects(range) {
        return !(
          range.x >= this.x + this.w ||
          range.x + range.w <= this.x ||
          range.y >= this.y + this.h ||
          range.y + range.h <= this.y
        );
      }
    }

    /**
     * Quadtree espacial reconstruída a cada frame para indexar unidades 2D.
     */
    class Quadtree {
      constructor(boundary, capacity = 4, depth = 0, maxDepth = 8) {
        this.boundary = boundary;
        this.capacity = capacity;
        this.depth = depth;
        this.maxDepth = maxDepth;
        this.points = [];
        this.divided = false;
        this.nw = null;
        this.ne = null;
        this.sw = null;
        this.se = null;
      }

      // Subdivide o nó atual em 4 quadrantes iguais: NW, NE, SW e SE.
      subdivide() {
        const { x, y, w, h } = this.boundary;
        const hw = w / 2;
        const hh = h / 2;
        const nextDepth = this.depth + 1;

        this.nw = new Quadtree(new Boundary(x, y, hw, hh), this.capacity, nextDepth, this.maxDepth);
        this.ne = new Quadtree(new Boundary(x + hw, y, hw, hh), this.capacity, nextDepth, this.maxDepth);
        this.sw = new Quadtree(new Boundary(x, y + hh, hw, hh), this.capacity, nextDepth, this.maxDepth);
        this.se = new Quadtree(new Boundary(x + hw, y + hh, hw, hh), this.capacity, nextDepth, this.maxDepth);
        this.divided = true;

        // Redistribui as entidades já armazenadas no nó pai para os filhos
        for (let i = 0; i < this.points.length; i++) {
          const p = this.points[i];
          this.nw.insert(p) || this.ne.insert(p) || this.sw.insert(p) || this.se.insert(p);
        }
        this.points.length = 0;
      }

      // Insere uma entidade na árvore, subdividindo se exceder a capacidade.
      insert(entity) {
        if (!this.boundary.contains(entity)) return false;

        if (!this.divided) {
          if (this.points.length < this.capacity || this.depth >= this.maxDepth) {
            this.points.push(entity);
            return true;
          }
          this.subdivide();
        }

        return (
          this.nw.insert(entity) ||
          this.ne.insert(entity) ||
          this.sw.insert(entity) ||
          this.se.insert(entity)
        );
      }

      // Consulta todas as entidades dentro da região retangular `range`.
      query(range, found = []) {
        if (!this.boundary.intersects(range)) return found;

        if (!this.divided) {
          for (let i = 0; i < this.points.length; i++) {
            const p = this.points[i];
            if (range.contains(p)) found.push(p);
          }
          return found;
        }

        this.nw.query(range, found);
        this.ne.query(range, found);
        this.sw.query(range, found);
        this.se.query(range, found);
        return found;
      }

      // Limpa toda a árvore para reconstrução limpa no próximo frame.
      clear() {
        this.points.length = 0;
        this.nw = null;
        this.ne = null;
        this.sw = null;
        this.se = null;
        this.divided = false;
      }

      // Conta o total de nós existentes para exibição no HUD de benchmark.
      countNodes() {
        if (!this.divided) return 1;
        return (
          1 +
          this.nw.countNodes() +
          this.ne.countNodes() +
          this.sw.countNodes() +
          this.se.countNodes()
        );
      }

      // Renderiza a grade das subdivisões no Canvas 2D.
      draw(ctx) {
        const { x, y, w, h } = this.boundary;
        ctx.strokeRect(x, y, w, h);
        if (this.divided) {
          this.nw.draw(ctx);
          this.ne.draw(ctx);
          this.sw.draw(ctx);
          this.se.draw(ctx);
        }
      }
    }

    // =========================================================================
    // 2. ENTIDADES RTS: UNIDADES, PROJÉTEIS E FEEDBACK VISUAL
    // =========================================================================
    let nextUnitId = 1;

    class Unit {
      constructor(x, y, team) {
        this.id = nextUnitId++;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.speed = 1.35 + Math.random() * 0.25;
        this.radius = 4.5;
        this.hp = 100;
        this.maxHp = 100;
        this.visionRange = 135;
        this.attackRange = 76;
        this.fireCooldown = 0.45; // segundos entre disparos
        this.cooldown = Math.random() * 0.25;
        this.damage = 14;
        this.team = team; // 'blue' | 'red'
        this.selected = false;
        this.targetPos = null; // { x, y } comandado via botão direito
      }
    }

    /**
     * Torre defensiva fixa (bunker) que protege a base usando consultas espaciais.
     */
    class Tower {
      constructor(id, x, y, laneRatio, xOffset) {
        this.id = id;
        this.isTower = true;
        this.team = 'blue';
        this.x = x;
        this.y = y;
        this.laneRatio = laneRatio;
        this.xOffset = xOffset;
        this.radius = 15;
        this.hp = 900;
        this.maxHp = 900;
        this.attackRange = 195;
        this.fireCooldown = 0.28;
        this.cooldown = 0;
        this.damage = 26;
        this.angle = 0;
        this.kills = 0;
        this.shotsFired = 0;
        this.destroyed = false;
      }
    }

    class Laser {
      constructor(x1, y1, x2, y2, team, isTowerShot = false) {
        this.x1 = x1;
        this.y1 = y1;
        this.x2 = x2;
        this.y2 = y2;
        this.team = team;
        this.isTowerShot = isTowerShot;
        this.life = isTowerShot ? 0.18 : 0.14;
        this.maxLife = this.life;
      }
    }

    class Spark {
      constructor(x, y, color) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.8 + Math.random() * 2.2;
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = color;
        this.life = 0.28;
        this.maxLife = 0.28;
      }
    }

    class MoveMarker {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.life = 0.45;
        this.maxLife = 0.45;
      }
    }

    // =========================================================================
    // 3. ESTADO GLOBAL DA ARENA E CONTROLES DE BENCHMARK
    // =========================================================================
    const canvas = document.getElementById('arena');
    const ctx = canvas.getContext('2d');

    const hudEl = document.getElementById('hud');
    const toggleHudBtn = document.getElementById('toggleHudBtn');
    const quadtreeToggle = document.getElementById('quadtreeToggle');
    const gridToggle = document.getElementById('gridToggle');
    const rangesToggle = document.getElementById('rangesToggle');
    const autoWaveToggle = document.getElementById('autoWaveToggle');
    const capacitySlider = document.getElementById('capacitySlider');
    const capacityVal = document.getElementById('capacityVal');
    const spawnModeBtn = document.getElementById('spawnModeBtn');
    const spawnBlueBtn = document.getElementById('spawnBlueBtn');
    const spawnRedBtn = document.getElementById('spawnRedBtn');
    const waveBtn = document.getElementById('waveBtn');
    const resetBtn = document.getElementById('resetBtn');
    const metricsEl = document.getElementById('metrics');

    const state = {
      width: window.innerWidth,
      height: window.innerHeight,
      useQuadtree: true,
      showGrid: true,
      showTowerRanges: true,
      autoWaves: false,
      waveTimer: 0,
      waveInterval: 10,
      waveNumber: 0,
      towerShots: 0,
      capacity: 4,
      spawnMode: 'off', // 'off' | 'blue' | 'red'
      units: [],
      towers: [],
      lasers: [],
      sparks: [],
      markers: [],
      quadtree: null,
      distanceChecks: 0,
      logicMs: 0,
      nodeCount: 1,
      fps: 60,
      mouse: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
      dragBox: null // { startX, startY, currX, currY }
    };

    function computeTowerPos(laneRatio, xOffset) {
      const baseLineX = state.width >= 760
        ? Math.max(345, state.width * 0.31)
        : Math.max(96, state.width * 0.26);
      return {
        x: Math.max(40, Math.min(state.width - 40, baseLineX + xOffset)),
        y: Math.max(48, Math.min(state.height - 48, state.height * laneRatio))
      };
    }

    function layoutTowers() {
      for (let i = 0; i < state.towers.length; i++) {
        const t = state.towers[i];
        const pos = computeTowerPos(t.laneRatio, t.xOffset);
        t.x = pos.x;
        t.y = pos.y;
      }
    }

    function createDefenseTowers() {
      const specs = [
        { id: 'T1', laneRatio: 0.22, xOffset: -24 },
        { id: 'T2', laneRatio: 0.50, xOffset: 18 },
        { id: 'T3', laneRatio: 0.78, xOffset: -24 }
      ];
      return specs.map((spec) => {
        const pos = computeTowerPos(spec.laneRatio, spec.xOffset);
        return new Tower(spec.id, pos.x, pos.y, spec.laneRatio, spec.xOffset);
      });
    }

    function resizeArena() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      canvas.width = state.width;
      canvas.height = state.height;
      state.quadtree = new Quadtree(new Boundary(0, 0, state.width, state.height), state.capacity);
      layoutTowers();
    }

    function spawnSquad(team, count, cx, cy, spreadX = 90, spreadY = 90) {
      const margin = 12;
      for (let i = 0; i < count; i++) {
        const x = Math.max(margin, Math.min(state.width - margin, cx + (Math.random() - 0.5) * spreadX));
        const y = Math.max(margin, Math.min(state.height - margin, cy + (Math.random() - 0.5) * spreadY));
        state.units.push(new Unit(x, y, team));
      }
    }

    function spawnEnemyWave(count = 40) {
      state.waveNumber++;
      const lanes = [0.22, 0.50, 0.78];
      const baseCount = Math.floor(count / lanes.length);
      let remainder = count % lanes.length;
      const spawnX = Math.max(40, state.width - 36);

      for (let i = 0; i < lanes.length; i++) {
        const laneCount = baseCount + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder--;
        spawnSquad('red', laneCount, spawnX, state.height * lanes[i], 44, 75);
      }
    }

    function resetBattle() {
      state.units = [];
      state.towers = createDefenseTowers();
      state.lasers = [];
      state.sparks = [];
      state.markers = [];
      state.waveNumber = 0;
      state.waveTimer = 0;
      state.towerShots = 0;
      nextUnitId = 1;

      const marginY = state.height * 0.12;
      const bandH = state.height - marginY * 2;
      const blueXMin = Math.max(30, state.width * 0.08);
      const blueXMax = Math.max(blueXMin + 60, state.width * 0.28);
      const redXMin = Math.min(state.width - 90, state.width * 0.72);
      const redXMax = Math.max(redXMin + 60, state.width - Math.max(30, state.width * 0.08));

      for (let i = 0; i < 150; i++) {
        const bx = blueXMin + Math.random() * (blueXMax - blueXMin);
        const by = marginY + Math.random() * bandH;
        state.units.push(new Unit(bx, by, 'blue'));

        const rx = redXMin + Math.random() * (redXMax - redXMin);
        const ry = marginY + Math.random() * bandH;
        state.units.push(new Unit(rx, ry, 'red'));
      }
    }

    // =========================================================================
    // 4. LÓGICA DE COMBATE, SEPARAÇÃO (SOFT-COLLISION) E RECONSTRUÇÃO
    // =========================================================================
    function updateSimulation(dt) {
      const t0 = performance.now();
      state.distanceChecks = 0;

      if (state.autoWaves) {
        state.waveTimer += dt;
        if (state.waveTimer >= state.waveInterval) {
          state.waveTimer -= state.waveInterval;
          spawnEnemyWave(40);
        }
      }

      // Reconstroi a Quadtree do zero com a capacidade configurada no HUD
      if (!state.quadtree) {
        state.quadtree = new Quadtree(new Boundary(0, 0, state.width, state.height), state.capacity);
      } else {
        state.quadtree.clear();
        state.quadtree.capacity = state.capacity;
        state.quadtree.boundary = new Boundary(0, 0, state.width, state.height);
      }

      const aliveTowers = [];
      for (let i = 0; i < state.towers.length; i++) {
        if (state.towers[i].hp > 0) aliveTowers.push(state.towers[i]);
      }

      let bruteEntities = null;
      if (state.useQuadtree) {
        for (let i = 0; i < state.units.length; i++) {
          if (state.units[i].hp > 0) state.quadtree.insert(state.units[i]);
        }
        for (let i = 0; i < aliveTowers.length; i++) {
          state.quadtree.insert(aliveTowers[i]);
        }
        state.nodeCount = state.quadtree.countNodes();
      } else {
        state.nodeCount = 0;
        bruteEntities = state.units.concat(aliveTowers);
      }

      const sepRadiusFactor = 3.2;

      for (let i = 0; i < state.units.length; i++) {
        const u = state.units[i];
        if (u.hp <= 0) continue;

        if (u.cooldown > 0) u.cooldown -= dt;

        // 1) Consulta de vizinhos (Quadtree vs Força Bruta O(N^2))
        let nearbyAll;
        let visionCandidates;

        if (state.useQuadtree) {
          const sepR = u.radius * sepRadiusFactor + 16;
          nearbyAll = state.quadtree.query(new Boundary(u.x - sepR, u.y - sepR, sepR * 2, sepR * 2));
          visionCandidates = state.quadtree.query(
            new Boundary(u.x - u.visionRange, u.y - u.visionRange, u.visionRange * 2, u.visionRange * 2)
          );
        } else {
          // Força Bruta O(N²): todas as entidades vivas são varridas para cada unidade
          nearbyAll = bruteEntities;
          visionCandidates = bruteEntities;
        }

        // 2) Separação orgânica (Soft-Collision) e contorno de torres fixas
        let sepX = 0;
        let sepY = 0;

        for (let j = 0; j < nearbyAll.length; j++) {
          const other = nearbyAll[j];
          if (other === u || other.hp <= 0) continue;

          state.distanceChecks++;
          const minSep = other.isTower ? (u.radius + other.radius + 5) : (u.radius * 2.35);
          const minSepSq = minSep * minSep;
          const dx = u.x - other.x;
          const dy = u.y - other.y;
          const dSq = dx * dx + dy * dy;

          if (dSq > 0.0001 && dSq < minSepSq) {
            const dist = Math.sqrt(dSq);
            const push = (minSep - dist) / minSep;
            const weight = other.isTower ? 1.8 : 1.15;
            sepX += (dx / dist) * push * weight;
            sepY += (dy / dist) * push * weight;
          } else if (dSq <= 0.0001) {
            // Desempata caso duas unidades nasçam no mesmo pixel
            sepX += (Math.random() - 0.5) * 0.6;
            sepY += (Math.random() - 0.5) * 0.6;
          }
        }

        // 3) Busca do inimigo mais próximo dentro do raio de visão
        let nearestEnemy = null;
        let nearestDistSq = u.visionRange * u.visionRange;

        for (let j = 0; j < visionCandidates.length; j++) {
          const cand = visionCandidates[j];
          if (cand.team === u.team || cand.hp <= 0) continue;

          state.distanceChecks++;
          const dx = cand.x - u.x;
          const dy = cand.y - u.y;
          const dSq = dx * dx + dy * dy;

          if (dSq < nearestDistSq) {
            nearestDistSq = dSq;
            nearestEnemy = cand;
          }
        }

        // 4) Decisão de movimento e disparo
        let moveX = 0;
        let moveY = 0;

        if (u.targetPos) {
          const dx = u.targetPos.x - u.x;
          const dy = u.targetPos.y - u.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 10) {
            u.targetPos = null;
          } else {
            moveX = (dx / dist) * u.speed;
            moveY = (dy / dist) * u.speed;
          }
        } else if (nearestEnemy) {
          const dist = Math.sqrt(nearestDistSq);
          const effectiveRange = nearestEnemy.isTower ? (u.attackRange + nearestEnemy.radius) : u.attackRange;
          if (dist <= effectiveRange) {
            // Em alcance de tiro: mantém posição e dispara
            if (u.cooldown <= 0) {
              u.cooldown = u.fireCooldown;
              nearestEnemy.hp -= u.damage;
              state.lasers.push(new Laser(u.x, u.y, nearestEnemy.x, nearestEnemy.y, u.team));
              if (nearestEnemy.hp <= 0) {
                if (nearestEnemy.isTower) {
                  if (!nearestEnemy.destroyed) {
                    nearestEnemy.destroyed = true;
                    const burstColors = ['#38bdf8', '#fbbf24', '#f8fafc'];
                    for (let k = 0; k < 18; k++) {
                      state.sparks.push(new Spark(nearestEnemy.x, nearestEnemy.y, burstColors[k % burstColors.length]));
                    }
                  }
                } else {
                  const sparkColor = nearestEnemy.team === 'blue' ? '#7dd3fc' : '#fda4af';
                  for (let k = 0; k < 5; k++) state.sparks.push(new Spark(nearestEnemy.x, nearestEnemy.y, sparkColor));
                }
              }
            }
          } else {
            moveX = ((nearestEnemy.x - u.x) / dist) * u.speed;
            moveY = ((nearestEnemy.y - u.y) / dist) * u.speed;
          }
        } else {
          // Sem inimigos no raio de visão: Vermelhos priorizam torres vivas; caso contrário avançam no campo
          let targetTower = null;
          if (u.team === 'red' && aliveTowers.length > 0) {
            let bestDistSq = Infinity;
            for (let tIdx = 0; tIdx < aliveTowers.length; tIdx++) {
              const tw = aliveTowers[tIdx];
              const dx = tw.x - u.x;
              const dy = tw.y - u.y;
              const dSq = dx * dx + dy * dy;
              if (dSq < bestDistSq) {
                bestDistSq = dSq;
                targetTower = tw;
              }
            }
          }

          if (targetTower) {
            const dist = Math.hypot(targetTower.x - u.x, targetTower.y - u.y) || 1;
            moveX = ((targetTower.x - u.x) / dist) * (u.speed * 0.85);
            moveY = ((targetTower.y - u.y) / dist) * (u.speed * 0.85);
          } else {
            const dirX = u.team === 'blue' ? 1 : -1;
            const driftY = (state.height * 0.5 - u.y) * 0.0025;
            const mag = Math.hypot(dirX, driftY) || 1;
            moveX = (dirX / mag) * (u.speed * 0.85);
            moveY = (driftY / mag) * (u.speed * 0.85);
          }
        }

        // Aplica movimento + força de separação orgânica
        const scale = dt * 60;
        u.vx = (moveX + sepX * 1.4) * scale;
        u.vy = (moveY + sepY * 1.4) * scale;
        u.x += u.vx;
        u.y += u.vy;

        // Mantém unidades dentro dos limites do Canvas
        const pad = u.radius + 4;
        if (u.x < pad) u.x = pad;
        if (u.x > state.width - pad) u.x = state.width - pad;
        if (u.y < pad) u.y = pad;
        if (u.y > state.height - pad) u.y = state.height - pad;
      }

      // 5) Torres Defensivas (Bunkers): consulta espacial na Quadtree para travar alvo e disparar
      for (let i = 0; i < state.towers.length; i++) {
        const t = state.towers[i];
        if (t.hp <= 0) continue;

        if (t.cooldown > 0) t.cooldown -= dt;

        const candidates = state.useQuadtree
          ? state.quadtree.query(new Boundary(t.x - t.attackRange, t.y - t.attackRange, t.attackRange * 2, t.attackRange * 2))
          : state.units;

        let nearestEnemy = null;
        let nearestDistSq = t.attackRange * t.attackRange;

        for (let j = 0; j < candidates.length; j++) {
          const cand = candidates[j];
          state.distanceChecks++;
          if (cand.team === t.team || cand.isTower || cand.hp <= 0) continue;

          const dx = cand.x - t.x;
          const dy = cand.y - t.y;
          const dSq = dx * dx + dy * dy;
          if (dSq <= nearestDistSq) {
            nearestDistSq = dSq;
            nearestEnemy = cand;
          }
        }

        if (nearestEnemy) {
          t.angle = Math.atan2(nearestEnemy.y - t.y, nearestEnemy.x - t.x);
          if (t.cooldown <= 0) {
            t.cooldown = t.fireCooldown;
            t.shotsFired++;
            state.towerShots++;
            nearestEnemy.hp -= t.damage;

            const mx = t.x + Math.cos(t.angle) * (t.radius + 3);
            const my = t.y + Math.sin(t.angle) * (t.radius + 3);
            state.lasers.push(new Laser(mx, my, nearestEnemy.x, nearestEnemy.y, 'blue', true));

            if (nearestEnemy.hp <= 0) {
              t.kills++;
              for (let k = 0; k < 6; k++) state.sparks.push(new Spark(nearestEnemy.x, nearestEnemy.y, '#fda4af'));
            }
          }
        }
      }

      // Remove unidades abatidas e atualiza efeitos
      state.units = state.units.filter((u) => u.hp > 0);

      for (let i = state.lasers.length - 1; i >= 0; i--) {
        state.lasers[i].life -= dt;
        if (state.lasers[i].life <= 0) state.lasers.splice(i, 1);
      }

      for (let i = state.sparks.length - 1; i >= 0; i--) {
        const sp = state.sparks[i];
        sp.x += sp.vx * (dt * 60);
        sp.y += sp.vy * (dt * 60);
        sp.life -= dt;
        if (sp.life <= 0) state.sparks.splice(i, 1);
      }

      for (let i = state.markers.length - 1; i >= 0; i--) {
        state.markers[i].life -= dt;
        if (state.markers[i].life <= 0) state.markers.splice(i, 1);
      }

      state.logicMs = performance.now() - t0;
    }

    // =========================================================================
    // 5. RENDERIZAÇÃO NO CANVAS 2D
    // =========================================================================
    function drawOctagon(cx, cy, r) {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (Math.PI / 4) * i + Math.PI / 8;
        const px = cx + Math.cos(angle) * r;
        const py = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function renderTower(t) {
      if (t.hp <= 0) {
        ctx.save();
        drawOctagon(t.x, t.y, t.radius);
        ctx.fillStyle = 'rgba(30, 41, 59, 0.65)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(148, 163, 184, 0.65)';
        ctx.fillText(`${t.id} OFF`, t.x, t.y + t.radius + 13);
        ctx.restore();
        return;
      }

      ctx.save();
      drawOctagon(t.x, t.y, t.radius);
      ctx.fillStyle = '#1e293b';
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Núcleo interno da torre
      ctx.beginPath();
      ctx.arc(t.x, t.y, 8.5, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#7dd3fc';
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // Canhão rotativo apontado para o alvo
      const tipX = t.x + Math.cos(t.angle) * (t.radius + 4);
      const tipY = t.y + Math.sin(t.angle) * (t.radius + 4);
      ctx.beginPath();
      ctx.moveTo(t.x, t.y);
      ctx.lineTo(tipX, tipY);
      ctx.strokeStyle = '#bae6fd';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(tipX, tipY, 2.2, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();

      // Barra de HP fixa acima da torre
      const ratio = Math.max(0, t.hp / t.maxHp);
      const bw = 34;
      const bh = 4;
      const bx = t.x - bw / 2;
      const by = t.y - t.radius - 10;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      ctx.fillStyle = ratio > 0.55 ? '#4ade80' : ratio > 0.25 ? '#fbbf24' : '#fb7185';
      ctx.fillRect(bx, by, bw * ratio, bh);

      // Rótulo de identificação (T1, T2, T3)
      ctx.font = '600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#bae6fd';
      ctx.fillText(t.id, t.x, t.y + t.radius + 14);
      ctx.restore();
    }

    function renderArena() {
      ctx.fillStyle = '#0b0e14';
      ctx.fillRect(0, 0, state.width, state.height);

      // 1) Grade semitransparente da Quadtree
      if (state.showGrid && state.useQuadtree && state.quadtree) {
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)';
        ctx.lineWidth = 1;
        state.quadtree.draw(ctx);
        ctx.restore();
      }

      // 1b) Alcance das 3 torres defensivas (anel tracejado) e ruínas de torres destruídas
      if (state.showTowerRanges) {
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.lineWidth = 1.2;
        for (let i = 0; i < state.towers.length; i++) {
          const t = state.towers[i];
          if (t.hp <= 0) continue;
          const activeGlow = t.cooldown > t.fireCooldown * 0.45 ? 0.26 : 0.14;
          ctx.strokeStyle = `rgba(56, 189, 248, ${activeGlow})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.attackRange, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      for (let i = 0; i < state.towers.length; i++) {
        if (state.towers[i].hp <= 0) renderTower(state.towers[i]);
      }

      // 2) Marcadores de movimento (botão direito)
      for (let i = 0; i < state.markers.length; i++) {
        const m = state.markers[i];
        const t = 1 - m.life / m.maxLife;
        ctx.save();
        ctx.strokeStyle = `rgba(74, 222, 128, ${1 - t})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 6 + t * 18, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 3) Lasers de combate (feixe duplo para disparos de torres)
      for (let i = 0; i < state.lasers.length; i++) {
        const l = state.lasers[i];
        const alpha = Math.max(0, l.life / l.maxLife);
        if (l.isTowerShot) {
          ctx.lineWidth = 4.5;
          ctx.strokeStyle = `rgba(56, 189, 248, ${alpha * 0.55})`;
          ctx.beginPath();
          ctx.moveTo(l.x1, l.y1);
          ctx.lineTo(l.x2, l.y2);
          ctx.stroke();

          ctx.lineWidth = 1.8;
          ctx.strokeStyle = `rgba(224, 242, 254, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(l.x1, l.y1);
          ctx.lineTo(l.x2, l.y2);
          ctx.stroke();
        } else {
          ctx.lineWidth = 1.6;
          ctx.strokeStyle = l.team === 'blue'
            ? `rgba(125, 211, 252, ${alpha})`
            : `rgba(251, 146, 60, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(l.x1, l.y1);
          ctx.lineTo(l.x2, l.y2);
          ctx.stroke();
        }
      }

      // 4) Unidades (exércitos Azul e Vermelho) + anéis de seleção + barra de HP
      for (let i = 0; i < state.units.length; i++) {
        const u = state.units[i];

        if (u.selected) {
          ctx.strokeStyle = '#4ade80';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(u.x, u.y, u.radius + 3.2, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.fillStyle = u.team === 'blue' ? '#38bdf8' : '#fb7185';
        ctx.beginPath();
        ctx.arc(u.x, u.y, u.radius, 0, Math.PI * 2);
        ctx.fill();

        if (u.hp < u.maxHp) {
          const bw = 10;
          const bh = 2;
          const bx = u.x - bw / 2;
          const by = u.y - u.radius - 5;
          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = u.hp > 40 ? '#4ade80' : '#fbbf24';
          ctx.fillRect(bx, by, bw * Math.max(0, u.hp / u.maxHp), bh);
        }
      }

      // 4b) Torres defensivas ativas (bunkers T1, T2, T3)
      for (let i = 0; i < state.towers.length; i++) {
        if (state.towers[i].hp > 0) renderTower(state.towers[i]);
      }

      // 5) Faíscas de impacto
      for (let i = 0; i < state.sparks.length; i++) {
        const sp = state.sparks[i];
        ctx.globalAlpha = Math.max(0, sp.life / sp.maxLife);
        ctx.fillStyle = sp.color;
        ctx.fillRect(sp.x - 1.5, sp.y - 1.5, 3, 3);
      }
      ctx.globalAlpha = 1;

      // 6) Caixa de seleção estilo StarCraft (botão esquerdo)
      if (state.dragBox) {
        const x = Math.min(state.dragBox.startX, state.dragBox.currX);
        const y = Math.min(state.dragBox.startY, state.dragBox.currY);
        const w = Math.abs(state.dragBox.currX - state.dragBox.startX);
        const h = Math.abs(state.dragBox.currY - state.dragBox.startY);
        ctx.fillStyle = 'rgba(74, 222, 128, 0.16)';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);
      }
    }

    // =========================================================================
    // 6. INTERATIVIDADE ESTILO STARCRAFT (SELEÇÃO, MOVIMENTO E SPAWN)
    // =========================================================================
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousemove', (e) => {
      state.mouse.x = e.offsetX;
      state.mouse.y = e.offsetY;
      if (state.dragBox) {
        state.dragBox.currX = e.offsetX;
        state.dragBox.currY = e.offsetY;
      }
    });

    canvas.addEventListener('mousedown', (e) => {
      state.mouse.x = e.offsetX;
      state.mouse.y = e.offsetY;

      // Botão esquerdo: spawn rápido se o modo spawn estiver ativo, senão inicia drag-select
      if (e.button === 0) {
        if (state.spawnMode === 'blue' || state.spawnMode === 'red') {
          spawnSquad(state.spawnMode, 50, e.offsetX, e.offsetY, 70, 70);
          return;
        }
        state.dragBox = {
          startX: e.offsetX,
          startY: e.offsetY,
          currX: e.offsetX,
          currY: e.offsetY
        };
      }

      // Botão direito: comando de movimento para unidades selecionadas
      if (e.button === 2) {
        const selected = state.units.filter((u) => u.selected);
        if (selected.length === 0) return;

        state.markers.push(new MoveMarker(e.offsetX, e.offsetY));
        const cols = Math.ceil(Math.sqrt(selected.length));
        const spacing = 13;

        selected.forEach((u, idx) => {
          const row = Math.floor(idx / cols);
          const col = idx % cols;
          const ox = (col - (cols - 1) / 2) * spacing;
          const oy = (row - (cols - 1) / 2) * spacing;
          u.targetPos = {
            x: Math.max(12, Math.min(state.width - 12, e.offsetX + ox)),
            y: Math.max(12, Math.min(state.height - 12, e.offsetY + oy))
          };
        });
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button !== 0 || !state.dragBox) return;

      const x = Math.min(state.dragBox.startX, state.dragBox.currX);
      const y = Math.min(state.dragBox.startY, state.dragBox.currY);
      const w = Math.abs(state.dragBox.currX - state.dragBox.startX);
      const h = Math.abs(state.dragBox.currY - state.dragBox.startY);
      state.dragBox = null;

      // Limpa seleção anterior
      for (let i = 0; i < state.units.length; i++) state.units[i].selected = false;

      if (w < 4 && h < 4) {
        // Clique simples: seleciona 1 unidade azul próxima ao cursor
        const box = new Boundary(x - 10, y - 10, 20, 20);
        const candidates = state.useQuadtree && state.quadtree ? state.quadtree.query(box) : state.units;
        for (let i = 0; i < candidates.length; i++) {
          const u = candidates[i];
          if (!u.isTower && u.team === 'blue' && Math.hypot(u.x - x, u.y - y) <= u.radius + 6) {
            u.selected = true;
            break;
          }
        }
      } else {
        // Drag-Select: usa quadtree.query(range) para selecionar tropas Azuis dentro da caixa
        const selectBox = new Boundary(x, y, w, h);
        const found = state.useQuadtree && state.quadtree
          ? state.quadtree.query(selectBox)
          : state.units.filter((u) => selectBox.contains(u));

        for (let i = 0; i < found.length; i++) {
          if (!found[i].isTower && found[i].team === 'blue') found[i].selected = true;
        }
      }
    });

    // =========================================================================
    // 7. CONTROLES DO HUD & ATALHOS DE TECLADO
    // =========================================================================
    quadtreeToggle.addEventListener('click', () => {
      state.useQuadtree = !state.useQuadtree;
      quadtreeToggle.textContent = state.useQuadtree
        ? 'Quadtree: ON (Espacial)'
        : 'Quadtree: OFF (Força Bruta)';
      quadtreeToggle.className = state.useQuadtree ? 'btn-on' : 'btn-off';
    });

    gridToggle.addEventListener('change', () => {
      state.showGrid = gridToggle.checked;
    });

    rangesToggle.addEventListener('change', () => {
      state.showTowerRanges = rangesToggle.checked;
    });

    autoWaveToggle.addEventListener('change', () => {
      state.autoWaves = autoWaveToggle.checked;
      state.waveTimer = 0;
    });

    capacitySlider.addEventListener('input', () => {
      state.capacity = Number(capacitySlider.value);
      capacityVal.textContent = String(state.capacity);
    });

    spawnModeBtn.addEventListener('click', () => {
      const next = state.spawnMode === 'off' ? 'blue' : state.spawnMode === 'blue' ? 'red' : 'off';
      state.spawnMode = next;
      spawnModeBtn.textContent = next === 'off'
        ? 'Spawn no clique: OFF'
        : next === 'blue'
          ? 'Spawn no clique: +50 Azul'
          : 'Spawn no clique: +50 Vermelho';
    });

    spawnBlueBtn.addEventListener('click', () => {
      spawnSquad('blue', 50, state.mouse.x || state.width * 0.3, state.mouse.y || state.height * 0.5);
    });

    spawnRedBtn.addEventListener('click', () => {
      spawnSquad('red', 50, state.mouse.x || state.width * 0.7, state.mouse.y || state.height * 0.5);
    });

    waveBtn.addEventListener('click', () => spawnEnemyWave(40));

    resetBtn.addEventListener('click', resetBattle);

    function toggleHud() {
      const collapsed = hudEl.classList.toggle('collapsed');
      toggleHudBtn.textContent = collapsed ? '+' : '−';
      toggleHudBtn.setAttribute('aria-expanded', String(!collapsed));
      toggleHudBtn.blur();
    }
    toggleHudBtn.addEventListener('click', toggleHud);

    window.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const active = document.activeElement;
      const tag = active ? active.tagName : '';
      const inputType = active && active.type ? active.type.toLowerCase() : '';
      if ((tag === 'INPUT' && inputType !== 'checkbox' && inputType !== 'range') || tag === 'SELECT' || tag === 'TEXTAREA') return;

      if (e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        toggleHud();
      } else if (e.key === 'b' || e.key === 'B') {
        spawnSquad('blue', 50, state.mouse.x, state.mouse.y, 70, 70);
      } else if (e.key === 'r' || e.key === 'R') {
        spawnSquad('red', 50, state.mouse.x, state.mouse.y, 70, 70);
      } else if (e.key === 'w' || e.key === 'W') {
        spawnEnemyWave(40);
      }
    });

    window.addEventListener('resize', resizeArena);

    // =========================================================================
    // 8. LOOP PRINCIPAL E TELEMETRIA DE BENCHMARK
    // =========================================================================
    let lastTime = performance.now();
    let lastHudUpdate = 0;

    function updateMetricsHud(now) {
      if (now - lastHudUpdate < 160) return;
      lastHudUpdate = now;

      let blueCount = 0;
      let redCount = 0;
      let selectedCount = 0;
      for (let i = 0; i < state.units.length; i++) {
        const u = state.units[i];
        if (u.team === 'blue') blueCount++;
        else redCount++;
        if (u.selected) selectedCount++;
      }

      let towersAlive = 0;
      for (let i = 0; i < state.towers.length; i++) {
        if (state.towers[i].hp > 0) towersAlive++;
      }

      metricsEl.textContent =
        `FPS:              ${state.fps.toFixed(0)}\n` +
        `Unidades Vivas:   ${state.units.length} (${blueCount} Azuis | ${redCount} Verm.)\n` +
        `Torres Defens.:   ${towersAlive} / ${state.towers.length} (Onda ${state.waveNumber})\n` +
        `Selecionadas:     ${selectedCount}\n` +
        `Testes Distância: ${state.distanceChecks.toLocaleString('pt-BR')} / frame\n` +
        `Tempo Lógica:     ${state.logicMs.toFixed(2)} ms\n` +
        `Nós Quadtree:     ${state.useQuadtree ? state.nodeCount : 'desligada'}`;
    }

    function loop(now) {
      const rawDt = Math.max(0.001, Math.min(0.05, (now - lastTime) / 1000));
      lastTime = now;

      const instantFps = 1 / rawDt;
      state.fps = state.fps * 0.85 + instantFps * 0.15;

      updateSimulation(rawDt);
      renderArena();
      updateMetricsHud(now);

      requestAnimationFrame(loop);
    }

    // API leve para inspeção em testes automatizados
    window.__RTS_DEBUG__ = {
      getState: () => {
        let blue = 0, red = 0, selected = 0, withTarget = 0, towersAlive = 0;
        for (const u of state.units) {
          if (u.team === 'blue') blue++;
          else red++;
          if (u.selected) selected++;
          if (u.targetPos) withTarget++;
        }
        for (const t of state.towers) {
          if (t.hp > 0) towersAlive++;
        }
        return {
          total: state.units.length,
          blue,
          red,
          selected,
          withTarget,
          towersAlive,
          towersTotal: state.towers.length,
          towerShots: state.towerShots,
          waveNumber: state.waveNumber,
          autoWaves: state.autoWaves,
          showTowerRanges: state.showTowerRanges,
          towers: state.towers.map((t) => ({
            id: t.id,
            x: Math.round(t.x),
            y: Math.round(t.y),
            hp: Math.max(0, Math.round(t.hp)),
            maxHp: t.maxHp,
            kills: t.kills,
            shotsFired: t.shotsFired
          })),
          useQuadtree: state.useQuadtree,
          showGrid: state.showGrid,
          capacity: state.capacity,
          distanceChecks: state.distanceChecks,
          nodeCount: state.nodeCount,
          logicMs: state.logicMs
        };
      }
    };

    resizeArena();
    resetBattle();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
